<!DOCTYPE html>
<html lang="en" data-theme="titanium">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting to Discord • ANUBH4B</title>
  
  <meta name="description" content="Join ANUBH4B's Discord community server.">
  <!-- Canonical URL & Mobile Web App -->
  <link rel="canonical" href="https://anubh4b.github.io/discord">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="color-scheme" content="dark">

  <!-- Performance Preconnect Hints -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Open Graph / Social Sharing -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Join ANUBH4B's Discord Server">
  <meta property="og:description" content="Connect, chat, and collaborate on ANUBH4B's official Discord community server.">
  <meta property="og:image" content="https://avatars.githubusercontent.com/u/74665803?v=4">
  <meta property="og:site_name" content="ANUBH4B">
  <meta name="theme-color" content="#060608">

  <!-- Twitter / X Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:site" content="@ANUBH4B">
  <meta name="twitter:creator" content="@ANUBH4B">
  <meta name="twitter:title" content="Join ANUBH4B's Discord Server">
  <meta name="twitter:description" content="Connect, chat, and collaborate on ANUBH4B's official Discord community server.">
  <meta name="twitter:image" content="https://avatars.githubusercontent.com/u/74665803?v=4">
  
  <link rel="icon" type="image/gif" href="favicons/lol.gif">

  <!-- Central Configuration -->
  <script src="js/config.js"></script>

  <link rel="stylesheet" href="css/style.css">
  
  <meta http-equiv="refresh" content="2; url=https://discord.gg/4CnVUmfatR">
</head>

<body>
  <!-- Ambient Animated Background Effects -->
  <div class="bg-ambient" aria-hidden="true">
    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>
  </div>
  <div class="bg-grid" aria-hidden="true"></div>
  <canvas id="particleCanvas" class="particle-canvas" aria-hidden="true"></canvas>

  <main class="card-perspective-wrapper">
    <div class="portfolio-card redirect-card" id="tiltCard">
      <div class="card-spotlight" aria-hidden="true"></div>
      
      <div class="card-content-inner">
        <div class="discord-icon-wrap" style="margin: 0 auto 12px;">
          <img src="images/discord.svg" alt="Discord">
        </div>
        
        <div class="title-group" style="margin-bottom: 6px;">
          <p class="greeting-text">ANUBH4B's Café</p>
          <h1 class="main-name" style="font-size: 1.5rem;">Redirecting to Discord...</h1>
        </div>
        
        <p class="bio-text" style="margin-bottom: 14px;">
          Taking you to the official Discord community server.
        </p>
        
        <a href="https://discord.gg/4CnVUmfatR" class="redirect-btn">
          <span>Join Server Directly</span>
          <span>&rarr;</span>
        </a>
        
        <p class="redirect-note" style="margin-top: 10px;">If not redirected automatically, click the button above.</p>
      </div>
    </div>
  </main>

  <!-- Custom Glowing Interactive Cursor -->
  <div class="custom-cursor-dot" id="cursorDot" aria-hidden="true"></div>
  <div class="custom-cursor-ring" id="cursorRing" aria-hidden="true"></div>

  <!-- Scripts -->
  <script src="js/script.js"></script>
</body>

</html>
